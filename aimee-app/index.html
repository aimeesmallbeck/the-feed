<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aimee — Voice Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        
        .header span {
            color: #00d4ff;
        }
        
        .connection-status {
            font-size: 12px;
            margin-top: 5px;
            color: rgba(255,255,255,0.5);
        }
        
        .connection-status.connected {
            color: #00ff88;
        }
        
        .connection-status.disconnected {
            color: #ff4444;
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        
        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-aimee {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        
        .message-user {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        
        .bubble {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 20px;
            position: relative;
        }
        
        .message-aimee .bubble {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-bottom-left-radius: 5px;
        }
        
        .message-user .bubble {
            background: rgba(255, 255, 255, 0.1);
            border-bottom-right-radius: 5px;
        }
        
        .voice-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            color: #00d4ff;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .voice-indicator.playing {
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .voice-wave {
            display: flex;
            gap: 3px;
            height: 20px;
            align-items: center;
        }
        
        .voice-wave span {
            width: 3px;
            background: #00d4ff;
            border-radius: 2px;
            animation: wave 1s infinite ease-in-out;
        }
        
        .voice-wave span:nth-child(1) { animation-delay: 0s; height: 8px; }
        .voice-wave span:nth-child(2) { animation-delay: 0.1s; height: 15px; }
        .voice-wave span:nth-child(3) { animation-delay: 0.2s; height: 20px; }
        .voice-wave span:nth-child(4) { animation-delay: 0.3s; height: 12px; }
        .voice-wave span:nth-child(5) { animation-delay: 0.4s; height: 18px; }
        
        @keyframes wave {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1); }
        }
        
        .details-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
            font-size: 14px;
            line-height: 1.6;
            border-left: 3px solid #00d4ff;
        }
        
        .details-panel h3 {
            color: #00d4ff;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .input-container {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 10px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        
        #userInput {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 25px;
            padding: 15px 20px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        
        #userInput::placeholder {
            color: rgba(255,255,255,0.4);
        }
        
        .mic-btn, .send-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .mic-btn {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        
        .mic-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .mic-btn.recording {
            background: #ff4444;
            animation: pulse 1s infinite;
        }
        
        .send-btn {
            background: #00d4ff;
            color: #1a1a2e;
        }
        
        .send-btn:hover {
            background: #00b8e6;
        }
        
        .status-bar {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }
        
        .thinking {
            display: flex;
            align-items: center;
            gap: 5px;
            color: rgba(255,255,255,0.6);
            font-style: italic;
        }
        
        .dots {
            display: flex;
            gap: 3px;
        }
        
        .dots span {
            width: 6px;
            height: 6px;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        
        .dots span:nth-child(1) { animation-delay: 0s; }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
        }
        
        .audio-player {
            margin-top: 10px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><span>🌀</span> AIMEE</h1>
        <div class="connection-status disconnected" id="connectionStatus">Connecting...</div>
    </div>
    
    <div class="chat-container" id="chatContainer">
        <!-- Welcome message -->
        <div class="message message-aimee">
            <div class="bubble">
                <div class="voice-indicator" id="voiceIndicator1">
                    <div class="voice-wave">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <span>Voice</span>
                </div>
                <div id="welcomeText">Connecting to Aimee...</div>
                <div class="details-panel">
                    <h3>📱 How This Works</h3>
                    <ul style="margin-left: 20px; margin-top: 10px;">
                        <li>Make sure the server is running</li>
                        <li>Press the mic button to talk</li>
                        <li>Or type in the text box</li>
                        <li>I'll respond with voice + details</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    
    <div class="status-bar" id="statusBar">Waiting for connection...</div>
    
    <div class="input-container">
        <button class="mic-btn" id="micBtn" title="Hold to speak">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
        </button>
        <input type="text" id="userInput" placeholder="Type your message..." />
        <button class="send-btn" id="sendBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </div>

    <script>
        // WebSocket URL - Will be determined at runtime
        // For local: ws://localhost:8765
        // For tunnel: wss://YOUR_TUNNEL_URL
        const WS_URL = 'wss://bottles-purple-container-mandatory.trycloudflare.com';
            ? 'ws://localhost:8765'
            : `wss://${window.location.host}`;
        
        // DOM elements
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const statusBar = document.getElementById('statusBar');
        const connectionStatus = document.getElementById('connectionStatus');
        const welcomeText = document.getElementById('welcomeText');
        
        // WebSocket connection
        let ws = null;
        let sessionId = 'session_' + Date.now();
        let isConnected = false;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;
        
        // Speech recognition setup
        let recognition = null;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';
        }
        
        // Connect to WebSocket server
        function connect() {
            statusBar.textContent = 'Connecting to Aimee...';
            
            try {
                ws = new WebSocket(WS_URL);
                
                ws.onopen = () => {
                    console.log('Connected to Aimee server');
                    isConnected = true;
                    reconnectAttempts = 0;
                    connectionStatus.textContent = '● Connected';
                    connectionStatus.classList.remove('disconnected');
                    connectionStatus.classList.add('connected');
                    statusBar.textContent = 'Ready • Speak or type';
                    
                    // Update welcome message
                    welcomeText.textContent = "Hey Scott! I'm live. Speak or type—I'll respond with voice and show details below.";
                };
                
                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        handleServerResponse(data);
                    } catch (e) {
                        console.error('Error parsing message:', e);
                    }
                };
                
                ws.onclose = () => {
                    console.log('Disconnected from server');
                    isConnected = false;
                    connectionStatus.textContent = '○ Disconnected';
                    connectionStatus.classList.remove('connected');
                    connectionStatus.classList.add('disconnected');
                    statusBar.textContent = 'Connection lost. Reconnecting...';
                    
                    // Auto reconnect
                    if (reconnectAttempts < maxReconnectAttempts) {
                        reconnectAttempts++;
                        setTimeout(connect, 3000);
                    }
                };
                
                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    statusBar.textContent = 'Connection error. Is the server running?';
                };
            } catch (e) {
                console.error('Error creating WebSocket:', e);
                statusBar.textContent = 'Failed to connect';
            }
        }
        
        // Handle server response
        function handleServerResponse(data) {
            if (data.type === 'response') {
                addAimeeMessage(data.voice_text, data.details_html, data.audio);
            } else if (data.type === 'error') {
                addErrorMessage(data.message);
            }
        }
        
        // Add user message
        function addUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'message message-user';
            div.innerHTML = `
                <div class="bubble">
                    ${escapeHtml(text)}
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        // Add Aimee message with voice
        function addAimeeMessage(voiceText, detailsHTML, audioBase64) {
            const div = document.createElement('div');
            div.className = 'message message-aimee';
            
            let audioHTML = '';
            if (audioBase64) {
                audioHTML = `
                    <audio class="audio-player" controls autoplay>
                        <source src="data:audio/mp3;base64,${audioBase64}" type="audio/mpeg">
                    </audio>
                `;
            }
            
            div.innerHTML = `
                <div class="bubble">
                    <div class="voice-indicator playing" id="voiceIndicatorNew">
                        <div class="voice-wave">
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <span>Speaking...</span>
                    </div>
                    <div>${escapeHtml(voiceText)}</div>
                    ${audioHTML}
                    <div class="details-panel">
                        ${detailsHTML}
                    </div>
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            // Update indicator when audio finishes
            const audio = div.querySelector('audio');
            const indicator = div.querySelector('.voice-indicator');
            
            if (audio && indicator) {
                audio.onended = () => {
                    indicator.classList.remove('playing');
                    indicator.innerHTML = '<span>✓ Voice</span>';
                };
            } else if (indicator) {
                // Fallback if no audio
                setTimeout(() => {
                    indicator.classList.remove('playing');
                    indicator.innerHTML = '<span>✓ Voice</span>';
                }, 2000);
            }
        }
        
        // Add error message
        function addErrorMessage(message) {
            const div = document.createElement('div');
            div.className = 'message message-aimee';
            div.innerHTML = `
                <div class="bubble">
                    <div style="color: #ff8888;">
                        ⚠️ ${escapeHtml(message)}
                    </div>
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Handle user input
        function handleUserInput() {
            const text = userInput.value.trim();
            if (!text || !isConnected) {
                if (!isConnected) {
                    statusBar.textContent = 'Not connected. Trying to reconnect...';
                    connect();
                }
                return;
            }
            
            addUserMessage(text);
            userInput.value = '';
            
            // Show thinking
            const thinking = document.createElement('div');
            thinking.className = 'message message-aimee';
            thinking.id = 'thinking';
            thinking.innerHTML = `
                <div class="bubble">
                    <div class="thinking">
                        <div class="dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <span>Thinking...</span>
                    </div>
                </div>
            `;
            chatContainer.appendChild(thinking);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            // Send to server
            ws.send(JSON.stringify({
                type: 'message',
                text: text,
                session_id: sessionId
            }));
        }
        
        // Send button
        sendBtn.addEventListener('click', handleUserInput);
        
        // Enter key
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleUserInput();
        });
        
        // Mic button
        if (recognition) {
            micBtn.addEventListener('mousedown', () => {
                micBtn.classList.add('recording');
                statusBar.textContent = 'Listening...';
                recognition.start();
            });
            
            micBtn.addEventListener('mouseup', () => {
                micBtn.classList.remove('recording');
                statusBar.textContent = 'Processing...';
                recognition.stop();
            });
            
            micBtn.addEventListener('mouseleave', () => {
                if (micBtn.classList.contains('recording')) {
                    micBtn.classList.remove('recording');
                    recognition.stop();
                }
            });
            
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                userInput.value = text;
                handleUserInput();
            };
            
            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                statusBar.textContent = 'Voice error. Try typing instead.';
                micBtn.classList.remove('recording');
            };
        } else {
            micBtn.style.display = 'none';
        }
        
        // Connect on load
        connect();
    </script>
</body>
</html>
